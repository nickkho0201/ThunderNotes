<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <!--
    Solid, self-contained icon used for the extension manifest's icons block
    (the add-ons manager).

    Deliberately NOT the theme-aware artwork: the add-ons manager renders these
    without the toolbar's context properties, so the context paint keyword would
    not resolve and the glyph would disappear. A concrete colour renders reliably
    everywhere, and the space toolbar uses its own theme-aware file instead.
  -->
  <path d="M8 1.25 3.4 4.6v3.1c0 2.55 1.94 4.9 4.6 5.55 2.66-.65 4.6-3 4.6-5.55V4.6L8 1.25Z"
        stroke="#15141a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M8.85 4.35 6.3 8.1h1.65l-.75 3.05L9.75 7.2H8.1l.75-2.85Z" fill="#15141a"/>
</svg>
