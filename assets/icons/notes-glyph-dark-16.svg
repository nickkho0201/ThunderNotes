<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <!--
    DARK glyph, for LIGHT themes. Supplied as `themeIcons[].dark`.

    Deliberately self-contained: every paint value is a literal colour, and there
    are no context paint keywords. A manual test in Thunderbird 156 showed that
    the context paint mechanism does NOT work for a custom space button, so these
    files must render identically no matter how Thunderbird inserts them.

    The matching light glyph is notes-glyph-light-16.svg (same artwork, lighter
    colour). notes-glyph-dark-32.svg is this artwork at exactly 2x.
  -->
  <path d="M8 1.25 3.4 4.6v3.1c0 2.55 1.94 4.9 4.6 5.55 2.66-.65 4.6-3 4.6-5.55V4.6L8 1.25Z"
        stroke="#15141a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M8.85 4.5 6.45 8.05h1.6l-.8 3.25L9.85 7.6h-1.6l.6-3.1Z" fill="#15141a"/>
</svg>
